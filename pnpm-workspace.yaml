# Add new dependencies to the catalog and remove unused entries.
catalogMode: prefer
cleanupUnusedCatalogs: true

packages:
  - packages/*
  - playground
  - docs

overrides:
  zod: 4.1.12

allowBuilds:
  sharp: true

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@arethetypeswrong/cli': ^0.18.5
  '@changesets/cli': ^3.0.3
  '@types/node': ^22.20.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  '@vitest/coverage-v8': ^5.0.3
  eslint: ^10.12.0
  eslint-plugin-markdown-preferences: ^0.42.0
  next: ^16.3.8
  nextra: ^4.6.1
  nextra-theme-docs: ^4.6.1
  pagefind: ^1.5.2
  react: ^19.3.0
  react-dom: ^19.3.0
  tsdown: ^0.23.0
  turbo: 2.11.7
  typescript: ^6.0.3
  vite: ^8.3.2
  vitest: ^5.0.3
